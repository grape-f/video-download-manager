name: Release Windows portable

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-portable:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Prune dev dependencies
        run: npm prune --omit=dev

      - name: Download yt-dlp
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe" -OutFile "yt-dlp.exe"

      - name: Download ffmpeg
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip" -OutFile "ffmpeg.zip"
          Expand-Archive -Path "ffmpeg.zip" -DestinationPath "ffmpeg-dist" -Force
          $ffmpeg = Get-ChildItem -Path "ffmpeg-dist" -Recurse -Filter "ffmpeg.exe" | Select-Object -First 1
          $ffprobe = Get-ChildItem -Path "ffmpeg-dist" -Recurse -Filter "ffprobe.exe" | Select-Object -First 1
          if (-not $ffmpeg -or -not $ffprobe) { throw "ffmpeg binaries not found" }
          $ffmpeg.DirectoryName | Set-Content "ffmpeg-bin.txt"

      - name: Download portable Node
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://nodejs.org/dist/latest-v24.x/win-x64/node.exe" -OutFile "node.exe"

      - name: Package
        shell: pwsh
        run: |
          $ffmpegDir = (Get-Content "ffmpeg-bin.txt" -Raw).Trim()
          node scripts/package-release.mjs --platform win-x64 --node node.exe --ytdlp yt-dlp.exe --ffmpeg-dir "$ffmpegDir" --out release --skip-build

      - name: Upload test artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-portable
          path: release/*.zip

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.zip
          generate_release_notes: true
